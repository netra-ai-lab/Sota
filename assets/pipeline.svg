<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="SOTA training pipeline: fine-tune, prune, cut, distil, recover">
<rect x="0.5" y="0.5" width="1279" height="249" rx="16" fill="#ffffff" stroke="#e0d5c5"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1c1917"/></marker><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#877e76"/></marker></defs>
<g font-family="Kantumruy Pro, DejaVu Sans, Arial, sans-serif">
<rect x="27.0" y="40" width="158" height="92" rx="10" fill="#ebe2d3" stroke="#e0d5c5"/>
<text x="106.0" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">Stock omniASR</text>
<text x="106.0" y="96" text-anchor="middle" font-size="12.5" fill="#5a524c">CTC-1B / CTC-300M</text>
<rect x="205.0" y="40" width="158" height="92" rx="10" fill="#ebe2d3" stroke="#e0d5c5"/>
<text x="284.0" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">1  Fine-tune</text>
<text x="284.0" y="96" text-anchor="middle" font-size="12.5" fill="#5a524c">CTC, 6k steps</text>
<line x1="187.0" y1="86.0" x2="203.0" y2="86.0" stroke="#1c1917" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="383.0" y="40" width="158" height="92" rx="10" fill="#ebe2d3" stroke="#e0d5c5"/>
<text x="462.0" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">2  Prune</text>
<text x="462.0" y="96" text-anchor="middle" font-size="12.5" fill="#5a524c">L0 gates to 80%,</text>
<text x="462.0" y="113" text-anchor="middle" font-size="12.5" fill="#5a524c">layer distillation</text>
<line x1="365.0" y1="86.0" x2="381.0" y2="86.0" stroke="#1c1917" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="561.0" y="40" width="158" height="92" rx="10" fill="#ebe2d3" stroke="#e0d5c5"/>
<text x="640.0" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">Cut</text>
<text x="640.0" y="96" text-anchor="middle" font-size="12.5" fill="#5a524c">remove pruned</text>
<text x="640.0" y="113" text-anchor="middle" font-size="12.5" fill="#5a524c">heads and units</text>
<line x1="543.0" y1="86.0" x2="559.0" y2="86.0" stroke="#1c1917" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="739.0" y="40" width="158" height="92" rx="10" fill="#ebe2d3" stroke="#e0d5c5"/>
<text x="818.0" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">2b  Distil</text>
<text x="818.0" y="96" text-anchor="middle" font-size="12.5" fill="#5a524c">mask frozen, 5k</text>
<line x1="721.0" y1="86.0" x2="737.0" y2="86.0" stroke="#1c1917" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="917.0" y="40" width="158" height="92" rx="10" fill="#ebe2d3" stroke="#e0d5c5"/>
<text x="996.0" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#1c1917">3  Recover</text>
<text x="996.0" y="96" text-anchor="middle" font-size="12.5" fill="#5a524c">CTC + logit KD, 16k</text>
<line x1="899.0" y1="86.0" x2="915.0" y2="86.0" stroke="#1c1917" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="1095.0" y="40" width="158" height="92" rx="10" fill="#e75f1b" stroke="#e75f1b"/>
<text x="1174.0" y="72" text-anchor="middle" font-size="16" font-weight="600" fill="#ffffff">SOTA model</text>
<text x="1174.0" y="96" text-anchor="middle" font-size="12.5" fill="#ffffff">large 204M · base 73M</text>
<line x1="1077.0" y1="86.0" x2="1093.0" y2="86.0" stroke="#1c1917" stroke-width="1.6" marker-end="url(#a)"/>
<path d="M284.0,132 V180" stroke="#877e76" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
<path d="M284.0,180 H996.0" stroke="#877e76" stroke-width="1.4" stroke-dasharray="5 4" fill="none"/>
<path d="M462.0,180 V136" stroke="#877e76" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#m)"/>
<path d="M818.0,180 V136" stroke="#877e76" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#m)"/>
<path d="M996.0,180 V136" stroke="#877e76" stroke-width="1.4" stroke-dasharray="5 4" fill="none" marker-end="url(#m)"/>
<text x="640.0" y="202" text-anchor="middle" font-size="13" fill="#5a524c">the Stage 1 model is the frozen teacher for stages 2, 2b and 3</text>
</g></svg>
